name: Build iOS App (React Native)
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build_ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Expo Prebuild (Generate native code)
        run: |
          EXPO_DEBUG=true npx expo prebuild --platform ios --clean --no-install
          ls -la ios/
          
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
        
      - name: Build Unsigned App
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: |
          WORKSPACE=$(ls ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            
      - name: Package IPA
        run: |
          cd derived_data/Build/Products/Release-iphoneos
          mkdir Payload
          APP_NAME=$(ls | grep '\.app$')
          echo "Packaging app: $APP_NAME"
          mv "$APP_NAME" Payload/
          zip -r BabySync.ipa Payload
          mv BabySync.ipa ../../../../
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabySync-IPA
          path: BabySync.ipa
          retention-days: 7
