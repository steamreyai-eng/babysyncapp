name: Build iOS App (React Native)
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build_ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          # Boot the simulator daemon to prevent "exit code 70" when downloading platform
          xcrun simctl list devices > /dev/null
          # Download iOS 18.2 Platform required for Storyboard compilation
          xcodebuild -downloadPlatform iOS
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Expo Prebuild (Generate native code)
        run: |
          EXPO_DEBUG=true npx expo prebuild --platform ios --clean --no-install
          ls -la ios/
          
      - name: Install CocoaPods
        run: |
          cd ios
          # Убираем дубликат simdjson от плагина WatermelonDB, так как Expo делает автолинк сам
          sed -i '' '/pod .simdjson./d' Podfile || true
          pod install --repo-update
        
      - name: Build Unsigned App
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
            
          # Verify .app was actually built and contains the compiled binary
          APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Build failed - no .app directory found"
            exit 1
          fi
          echo "Build successful: $APP_PATH"
            
      - name: Package IPA
        run: |
          cd derived_data/Build/Products/Release-iphoneos
          mkdir Payload
          APP_NAME=$(ls | grep '\.app$')
          echo "Packaging app: $APP_NAME"
          mv "$APP_NAME" Payload/
          zip -r BabySync.ipa Payload
          mv BabySync.ipa ../../../../
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabySync-IPA
          path: BabySync.ipa
          retention-days: 7
